<section class="consultations-card">
  <div class="section-header">
    <div class="section-title-row">
      <div class="header-icon-wrap">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
          <line x1="16" x2="16" y1="2" y2="6"/>
          <line x1="8" x2="8" y1="2" y2="6"/>
          <line x1="3" x2="21" y1="10" y2="10"/>
        </svg>
      </div>
      <h2 class="section-title">My Consultations</h2>
    </div>
    <p class="section-subtitle">View your upcoming and past consultations.</p>
  </div>

  <div class="consultations-container">
    @for (c of consultations; track c.id) {
      <div class="consultation-item-card">
        <div class="consultation-left">
          <div class="type-icon-box" [class.scheduled-type]="c.status === 'Scheduled'" [class.completed-type]="c.status === 'Completed'">
            @if (c.type === 'Chat') {
              <svg class="type-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
              </svg>
            } @else {
              <svg class="type-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="m22 8-6 4 6 4V8Z"/>
                <rect width="14" height="12" x="2" y="6" rx="2" ry="2"/>
              </svg>
            }
          </div>

          <div class="consultation-details">
            <h3 class="doctor-title">{{ c.doctorName }}</h3>
            <p class="consultation-meta">
              {{ c.specialty }} · {{ c.type === 'Video' ? 'Video Call' : 'Chat' }}
            </p>
            <div class="time-row">
              <svg class="time-calendar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="18" height="18" x="3" y="4" rx="2" ry="2"/>
                <line x1="16" x2="16" y1="2" y2="6"/>
                <line x1="8" x2="8" y1="2" y2="6"/>
                <line x1="3" x2="21" y1="10" y2="10"/>
              </svg>
              <span>{{ formatTime(c.preferredTime) }}</span>
            </div>
          </div>
        </div>

        <div class="consultation-right">
          <span class="status-badge" [class.scheduled]="c.status === 'Scheduled'" [class.completed]="c.status === 'Completed'">
            {{ c.status }}
          </span>
          <svg class="chevron-right" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M7.21 14.77a.75.75 0 01.02-1.06L11.168 10 7.23 6.29a.75.75 0 111.04-1.08l4.5 4.25a.75.75 0 010 1.08l-4.5 4.25a.75.75 0 01-1.06-.02z" clip-rule="evenodd" />
          </svg>
        </div>
      </div>
    }
  </div>
</section>
