<section class="doctor-list">
    <h2>Available Doctors</h2>
    <p class="subtitle">Find the right doctor for your needs. All doctors are available for online consultations.</p>
  
    <div class="doctor-card" *ngFor="let doctor of doctors">
      <div class="doctor-info">
        <h3>{{ doctor.name }}</h3>
        <p>{{ doctor.specialty }}</p>
        <span class="status" [class.available]="doctor.available">
          {{ doctor.available ? 'Available now' : 'Unavailable' }}
        </span>
      </div>
      <button class="book-btn">Book Consultation</button>
    </div>
  </section>
